name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Smoke test composite action without API key
        uses: ./
        with:
          command: python3 -c 'print("smoke test passed")'
          typesafe-api-key: ''
